[package]
name = "kosync"
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
panic = 'abort'
strip = 'debuginfo'

[dependencies]
axum = { version = "0.6", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = { version = "0", features = ["no_logs"] }

log = { version = "0", features = ["release_max_level_info"] }
tracing = { version = "0", features = ["release_max_level_info"] }
tracing-subscriber = "0"
shadow-rs = "0"

[build-dependencies]
shadow-rs = "0"

[dev-dependencies]
# Testing frameworks
proptest = "1.2"                                # Property-based testing
tower = { version = "0.4", features = ["util"] } # Tower utilities for testing Axum
hyper = { version = "0.14", features = ["full"] } # HTTP types for testing
reqwest = { version = "0.11", features = ["json"] } # HTTP client for testing
mockall = "0.11"                                # Mocking library
criterion = { version = "0.5", features = ["html_reports"] } # Benchmarking
time = "0.3.35"                                 # Time library (fixed version)

# Additional testing utilities
tokio-test = "0.4"                              # Tokio testing utilities
tempfile = "3.8"                                # Temporary file creation for tests
